[workspace]
resolver = "2"
members = [
    "crates/hazler-core",
    "crates/hazler-http",
    "crates/hazler-parser",
    "crates/hazler-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Hazler Team"]
license = "MIT"
repository = "https://github.com/HazaVVIP/hazler"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "cookies"] }
scraper = "0.18"
url = { version = "2.5", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
