[package]
name = "hazler-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core crawling engine and orchestration logic for the Hazler web crawler"

[dependencies]
tokio = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
rand = "0.8"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
hazler-http = { path = "../hazler-http", version = "0.2.0" }
hazler-parser = { path = "../hazler-parser", version = "0.2.0" }
hazler-js-parser = { path = "../hazler-js-parser", version = "0.2.0" }
hazler-secrets = { path = "../hazler-secrets", version = "0.2.0" }
hazler-browser = { path = "../hazler-browser", version = "0.2.0", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.8"
criterion = { workspace = true }

[features]
default = []
browser = ["hazler-browser"]

[[bench]]
name = "url_bench"
harness = false
