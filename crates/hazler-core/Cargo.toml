[package]
name = "hazler-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
rand = "0.8"
chrono = "0.4"
hazler-http = { path = "../hazler-http" }
hazler-parser = { path = "../hazler-parser" }
hazler-js-parser = { path = "../hazler-js-parser" }
hazler-secrets = { path = "../hazler-secrets" }
hazler-browser = { path = "../hazler-browser", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.8"
criterion = { workspace = true }

[features]
default = []
browser = ["hazler-browser"]

[[bench]]
name = "url_bench"
harness = false
