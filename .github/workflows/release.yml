name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.2.0-alpha.1). Leave empty to use tag.'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        run: cargo audit

  create-release:
    name: Create Release
    needs: check
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check_prerelease.outputs.prerelease }}
      is_stable: ${{ steps.check_prerelease.outputs.is_stable }}
      version: ${{ steps.get_version.outputs.version }}
      tag_name: ${{ steps.get_tag.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Validate tag exists (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        run: |
          git fetch --tags
          TAG="v${{ github.event.inputs.version }}"
          git tag --list "$TAG" | grep -q "$TAG" || {
            echo "::error::Tag $TAG does not exist. Create and push the tag before triggering a manual release."
            exit 1
          }

      - name: Get version from tag or input
        id: get_version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=0.0.0-dev" >> $GITHUB_OUTPUT
          fi

      - name: Resolve tag name
        id: get_tag
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "tag_name=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "::error::Cannot create a release: workflow was not triggered from a tag and no version input was provided."
            exit 1
          fi

      - name: Detect prerelease
        id: check_prerelease
        run: |
          # Honour explicit workflow_dispatch input first
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            if echo "$VERSION" | grep -qE '-(alpha|beta|rc)'; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          fi
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          if [[ "$PRERELEASE" == "true" ]]; then
            echo "is_stable=false" >> $GITHUB_OUTPUT
          else
            echo "is_stable=true" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag_name }}
          name: v${{ steps.get_version.outputs.version }}
          prerelease: ${{ steps.check_prerelease.outputs.prerelease == 'true' }}
          generate_release_notes: true

  build:
    name: Build for ${{ matrix.target }}
    needs: [check, create-release]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: hazler
            asset_name: hazler-linux-x86_64
            use_cross: false

          # Linux aarch64 — uses `cross` to handle OpenSSL cross-compilation
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: hazler
            asset_name: hazler-linux-aarch64
            use_cross: true

          # macOS x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            binary_name: hazler
            asset_name: hazler-macos-x86_64
            use_cross: false

          # macOS aarch64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_name: hazler
            asset_name: hazler-macos-aarch64
            use_cross: false

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary_name: hazler.exe
            asset_name: hazler-windows-x86_64
            use_cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cross binary
        if: matrix.use_cross
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cross
          key: cross-binary-${{ runner.os }}-0.2.5

      - name: Install cross
        if: matrix.use_cross
        run: |
          if ! command -v cross &> /dev/null; then
            cargo install cross --version 0.2.5 --locked
          fi

      - name: Build release binary (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build release binary (cargo)
        if: matrix.use_cross == false
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset_name }}.tar.gz ${{ matrix.binary_name }}
          cd ../../../
          shasum -a 256 ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Set-Location "target/${{ matrix.target }}/release"
          7z a "../../../${{ matrix.asset_name }}.zip" "${{ matrix.binary_name }}"
          Set-Location "../../.."
          $hash = (Get-FileHash "${{ matrix.asset_name }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}.zip" | Out-File "${{ matrix.asset_name }}.zip.sha256" -Encoding ascii

      - name: Upload release assets (Unix)
        if: matrix.os != 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          prerelease: ${{ needs.create-release.outputs.prerelease == 'true' }}
          files: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.tar.gz.sha256

      - name: Upload release assets (Windows)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          prerelease: ${{ needs.create-release.outputs.prerelease == 'true' }}
          files: |
            ${{ matrix.asset_name }}.zip
            ${{ matrix.asset_name }}.zip.sha256

  docker:
    name: Build and Push Docker Image
    needs: [check, create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ needs.create-release.outputs.is_stable == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ needs.create-release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  publish:
    name: Publish to crates.io
    needs: [check, create-release, build]
    runs-on: ubuntu-latest
    if: needs.create-release.outputs.is_stable == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Publish hazler-http
        run: cargo publish -p hazler-http --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io to index hazler-http
        run: sleep 30

      - name: Publish hazler-parser
        run: cargo publish -p hazler-parser --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io to index hazler-parser
        run: sleep 30

      - name: Publish hazler-js-parser
        run: cargo publish -p hazler-js-parser --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io to index hazler-js-parser
        run: sleep 30

      - name: Publish hazler-secrets
        run: cargo publish -p hazler-secrets --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io to index hazler-secrets
        run: sleep 30

      - name: Publish hazler-core
        run: cargo publish -p hazler-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io to index hazler-core
        run: sleep 30

      - name: Publish hazler-browser
        run: cargo publish -p hazler-browser --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io to index hazler-browser
        run: sleep 30

      - name: Publish hazler-fuzzer
        run: cargo publish -p hazler-fuzzer --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io to index hazler-fuzzer
        run: sleep 30

      - name: Publish hazler-cli
        run: cargo publish -p hazler-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

