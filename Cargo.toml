[workspace]
resolver = "2"
members = [
    "crates/hazler-core",
    "crates/hazler-http",
    "crates/hazler-parser",
    "crates/hazler-js-parser",
    "crates/hazler-secrets",
    "crates/hazler-cli", "crates/hazler-browser", "crates/hazler-fuzzer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Hazler Team"]
license = "MIT"
repository = "https://github.com/HazaVVIP/hazler"
homepage = "https://github.com/HazaVVIP/hazler"
documentation = "https://docs.rs/hazler"
description = "Next-generation intelligent web crawler built in Rust"
keywords = ["crawler", "spider", "web-scraping", "http", "async"]
categories = ["web-programming", "network-programming", "command-line-utilities"]
readme = "README.md"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "cookies"] }
scraper = "0.18"
url = { version = "2.5", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures = "0.3"
regex = "1.10"
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
